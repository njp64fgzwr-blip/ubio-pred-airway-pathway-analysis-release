name: Data-free reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install Linux system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             cmake             ghostscript             libcurl4-openssl-dev             libfontconfig1-dev             libfreetype6-dev             libmagick++-dev             libpng-dev

      - name: Restore locked R environment
        uses: r-lib/actions/setup-renv@v2

      - name: Confirm environment lock is synchronized
        run: Rscript -e 'status <- renv::status(); stopifnot(isTRUE(status$synchronized))'

      - name: Run data-free validation
        run: Rscript validate_results.R --public
